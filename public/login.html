<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Memory Kings Perú S.A.C.</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Header Mínimo -->
  <header class="main-header">
    <div class="header-container">
      <a href="/index.html" class="brand-logo">
        <span>MEMORY KINGS</span>
        <span class="brand-badge">SISTEMAS</span>
      </a>
      <a href="/index.html" class="btn-nav-action">Volver a la Tienda</a>
    </div>
  </header>

  <!-- Contenedor Central de Login -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Inicio de Sesión</h2>
        <p>Acceso a la plataforma de compras y panel ERP</p>
      </div>

      <div class="auth-body">
        <form id="loginForm" autocomplete="on">
          <div class="form-group">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-control" 
              placeholder="ejemplo@memorykings.com.pe" 
              required
            >
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="••••••••" 
              required
            >
          </div>

          <div id="loginAlert" style="display: none; margin-bottom: 15px; padding: 10px; border-radius: 6px; font-size: 0.85rem;"></div>

          <button type="submit" id="btnLogin" class="btn-primary">
            Ingresar al Sistema
          </button>
        </form>
      </div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script src="/js/login.js"></script>
</body>
</html>
